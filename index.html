const { useState, useEffect, useRef, useMemo } = React;

// ---------- Icons via lucide ----------
function Icon({ name, size = 18, className = "", style }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    ref.current.innerHTML = "";
    const svg = window.lucide.createIcons({
      icons: { [name]: window.lucide.icons[name] || window.lucide.icons.Circle },
      nameAttr: "data-lucide",
    });
    const el = document.createElement("i");
    el.setAttribute("data-lucide", toKebab(name));
    ref.current.appendChild(el);
    window.lucide.createIcons({ attrs: { width: size, height: size } });
  }, [name, size]);
  return <span ref={ref} className={"inline-flex " + className} style={{width:size, height:size, ...style}} />;
}
function toKebab(s){ return s.replace(/([a-z])([A-Z])/g,"$1-$2").toLowerCase(); }

// ---------- Simple router ----------
function useHash() {
  const [h, setH] = useState(window.location.hash || "#/");
  useEffect(() => {
    const on = () => setH(window.location.hash || "#/");
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  return h;
}
const go = (p) => { window.location.hash = p; };

// ---------- Local storage store ----------
const store = {
  get(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
};

// ---------- Auth (mocked with local storage) ----------
function useAuth() {
  const [user, setUser] = useState(() => store.get("apkforge_user", null));
  const login = (u) => { store.set("apkforge_user", u); setUser(u); };
  const logout = () => { localStorage.removeItem("apkforge_user"); setUser(null); go("#/"); };
  return { user, login, logout };
}

  const [name, setName] = useState("");

const BUILD_STEPS = [
  ["preparing","🔧 تجهيز بيئة البناء",5],
  ["preparing","📦 استخراج ملفات المصدر...",10],
  ["preparing","✓ Validated project structure",14],
  ["building","> Task :app:preBuild UP-TO-DATE",22],
  ["building","> Task :app:mergeDebugResources",32],
  ["building","> Task :app:compileDebugKotlin",45],
  ["building","> Task :app:processDebugManifest",58],
  ["building","> Task :app:mergeDexDebug",68],
  ["building","🎨 معالجة الأيقونة وشاشة البداية",76],
  ["building","🌐 حزم WebView assets للأوفلاين",84],
  ["signing","🔐 توقيع APK باستخدام keystore...",90],
  ["signing","✓ APK Signature Scheme v2 signed",95],
  ["signing","📱 zipalign optimizing APK...",98],
  ["completed","✅ BUILD SUCCESSFUL",100],
];

function startBuild(user, project) {
  const build_id = "build_" + Math.random().toString(36).slice(2,10);
  const build = {
    build_id, project_id: project.project_id, user_id: user.user_id,
    status: "queued", progress: 0,
    logs: [{ ts: Date.now(), message: `🚀 بدء بناء التطبيق: ${project.app_name}` }],
    started_at: Date.now(), apk_size_kb: 0, apk_sha256: "",
  };
  const key = "apkforge_builds_" + user.user_id;
  const builds = store.get(key, []);
  builds.unshift(build);
  store.set(key, builds);
  go("#/builds/" + build_id);

  // simulate
  let step = 0;
  const run = () => {
    const arr = store.get(key, []);
    const idx = arr.findIndex(b => b.build_id === build_id);
    if (idx < 0) return;
    if (step < BUILD_STEPS.length) {
      const [status, message, progress] = BUILD_STEPS[step++];
      arr[idx] = { ...arr[idx], status, progress, logs: [...arr[idx].logs, { ts: Date.now(), message }] };
      if (status === "completed") {
        arr[idx].apk_size_kb = 4321;
        arr[idx].apk_sha256 = Array.from({length:32},()=>Math.floor(Math.random()*16).toString(16)).join("");
      }
      store.set(key, arr);
      setTimeout(run, 900);
    }
  };
  setTimeout(run, 400);
}

// ---------- Download simulated APK ----------
function downloadApk(build, project) {
  const manifest = { package: project.package_id, version_name: project.version_name, app_name: project.app_name, note: "MOCKED APK — demo only" };
  const blob = new Blob([JSON.stringify(manifest, null, 2)], { type: "application/vnd.android.package-archive" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${project.package_id}-v${project.version_name}.apk`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

              <div className="space-y-5">
                <Field label="الأذونات المطلوبة">
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    {PERMISSIONS.map(p=>{
                      const a = form.permissions.includes(p.id);
                      return (
                        <label key={p.id} className={"cursor-pointer p-3 rounded-lg border text-sm flex items-center gap-2 " + (a?"border-emerald2 bg-emerald2/5":"border-slate-800 text-slate-400")}>
                          <input type="checkbox" checked={a} onChange={()=>togglePerm(p.id)} className="accent-emerald-500" />
                          {p.label}
                        </label>
                      );
                    })}
                  </div>
                </Field>
                <ToggleRow label="وضع الأوفلاين (PWA Cache)" desc="تخزين الأصول حتى يعمل بدون إنترنت." value={form.offline_mode} onChange={v=>upd("offline_mode",v)} />
                <ToggleRow label="الإشعارات اللحظية" desc="تفعيل Firebase Cloud Messaging." value={form.push_notifications} onChange={v=>upd("push_notifications",v)} />
              </div>
            </div>
          )}

          {step===4 && (
            <div className="fade-in">
              <SectionHeader n="04" title="التوقيع والأمان" desc="اختر طريقة توقيع ملف APK." />
              <div className="space-y-3">
                <SigningOption a={form.signing_mode==="debug"} onClick={()=>upd("signing_mode","debug")} icon="KeyRound" title="Debug Key" desc="سريع، للاختبار المحلي." badge="افتراضي" />
                <SigningOption a={form.signing_mode==="release"} onClick={()=>upd("signing_mode","release")} icon="ShieldCheck" title="Release Key (مُدار)" desc="جاهز للتوزيع." badge="موصى به" />
                <SigningOption a={form.signing_mode==="custom"} onClick={()=>upd("signing_mode","custom")} icon="FileArchive" title="Keystore مخصص (.jks)" desc="للنشر على Google Play." badge="متقدم" />
              </div>
              <div className="mt-8 p-5 rounded-xl border border-cyan2/30 bg-cyan2/5">
                <div className="heading font-bold mb-2">ملخص البناء</div>
                <ul className="text-sm text-slate-300 space-y-1 mono">
                  <li>▪ {form.app_name} <span className="text-slate-500">({form.package_id})</span></li>
                  <li>▪ Version <span className="text-white">{form.version_name}</span></li>
                  <li>▪ Source: <span className="text-cyan2">{form.source_type}</span></li>
                  <li>▪ Permissions: <span className="text-white">{form.permissions.length}</span></li>
                  <li>▪ Signing: <span className="text-emerald2">{form.signing_mode}</span></li>
                </ul>
              </div>
            </div>
          )}

          <div className="flex items-center justify-between mt-8">
            <button onClick={()=>setStep(s=>Math.max(1,s-1))} disabled={step===1} className="btn-ghost px-4 py-2.5 rounded-lg inline-flex items-center gap-2 disabled:opacity-30">
              <Icon name="ChevronRight" size={16} /> رجوع
            </button>
            {step<4 ? (
              <button onClick={()=>canNext() && setStep(s=>s+1)} disabled={!canNext()} className="btn-primary px-5 py-2.5 rounded-lg inline-flex items-center gap-2 disabled:opacity-40">
                التالي <Icon name="ChevronLeft" size={16} />
              </button>
            ) : (
              <button onClick={launch} className="btn-primary px-6 py-3 rounded-lg inline-flex items-center gap-2">
                <Icon name="Rocket" size={18} /> ابدأ البناء الآن
              </button>
            )}
          </div>
        </div>

        <div className="lg:sticky lg:top-24 h-fit">
          <div className="mb-4">
            <div className="mono text-xs text-slate-500">// LIVE PREVIEW</div>
            <div className="heading font-bold">معاينة على هاتف Android</div>
          </div>
          <div className="card-glow p-6 flex flex-col items-center gap-4">
            <PhonePreview appName={form.app_name} themeColor={form.theme_color} splashColor={form.splash_color} orientation={form.orientation} />
            <div className="mono text-xs text-slate-500 truncate w-full text-center">{form.package_id}</div>
          </div>
        </div>
      </div>
    </div>
  );
}
function SectionHeader({ n, title, desc }){
  return (<div className="mb-6">
    <div className="mono text-xs text-cyan2 mb-1">// STEP {n}</div>
    <h2 className="heading text-xl sm:text-2xl font-bold">{title}</h2>
    <p className="text-slate-400 text-sm mt-1">{desc}</p>
  </div>);
}
function Field({ label, hint, children }){
  return (<div>
    <div className="flex items-baseline justify-between mb-1.5">
      <label className="text-sm text-slate-300 font-semibold">{label}</label>
      {hint && <span className="text-[11px] mono text-slate-500">{hint}</span>}
    </div>{children}
  </div>);
}
function ToggleRow({ label, desc, value, onChange }){
  return (<div className="flex items-start justify-between gap-4 p-4 rounded-xl border border-slate-800">
    <div>
      <div className="heading font-semibold">{label}</div>
      <div className="text-xs text-slate-400 mt-0.5">{desc}</div>
    </div>
    <button onClick={()=>onChange(!value)} className={"relative w-12 h-6 rounded-full transition-colors " + (value?"bg-emerald2":"bg-slate-800")}>
      <span className={"absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all " + (value?"start-6":"start-0.5")} />
    </button>
  </div>);
}
function SigningOption({ a, onClick, icon, title, desc, badge }){
  return (<button onClick={onClick} className={"w-full text-start p-4 rounded-xl border flex items-center gap-4 transition-all " + (a?"border-cyan2 bg-cyan2/5":"border-slate-800 hover:border-slate-700")}>
    <div className={"w-11 h-11 rounded-xl flex items-center justify-center " + (a?"bg-cyan2/15 text-cyan2":"bg-slate-900 text-slate-400")}>
      <Icon name={icon} size={20} />
    </div>
    <div className="flex-1">
      <div className="flex items-center gap-2">
        <div className="heading font-bold">{title}</div>
        {badge && <span className="chip text-[10px]">{badge}</span>}
      </div>
      <div className="text-xs text-slate-400 mt-0.5">{desc}</div>
    </div>
  </button>);
}
function DropZone({ onFile, value, onClear }){
  const [drag, setDrag] = useState(false);
  const inputRef = useRef(null);
  const handle = (f) => {
    if (!f) return;
    onFile({ filename: f.name, size_bytes: f.size });
  };
  return (
    <div
      onDragOver={(e)=>{e.preventDefault(); setDrag(true);}}
      onDragLeave={()=>setDrag(false)}
      onDrop={(e)=>{e.preventDefault(); setDrag(false); handle(e.dataTransfer.files?.[0]);}}
      onClick={()=>inputRef.current?.click()}
      className={"relative cursor-pointer rounded-2xl border-2 border-dashed p-8 sm:p-10 text-center transition-all " + (drag?"border-cyan2 bg-cyan2/5":"border-slate-700 hover:border-cyan2/50")}>
      <input ref={inputRef} type="file" className="hidden" onChange={e=>handle(e.target.files?.[0])} />
      {!value ? (
        <div className="flex flex-col items-center gap-4">
          <div className="w-16 h-16 rounded-2xl bg-cyan2/10 border border-cyan2/30 flex items-center justify-center">
            <Icon name="UploadCloud" size={30} style={{color:"#00E5FF"}} />
          </div>
          <div>
            <div className="heading text-lg font-bold">اسحب وأفلت ملفات المصدر هنا</div>
            <div className="text-sm text-slate-400 mt-1">أو انقر لاختيار ملف — ZIP, HTML, JS, أو مصدر Android</div>
          </div>
          <div className="flex flex-wrap gap-2 justify-center">
            <span className="chip">HTML/CSS/JS</span><span className="chip">React Build</span>
            <span className="chip">Vue / Next</span><span className="chip">Kotlin / Java</span>
          </div>
        </div>
      ) : (
        <div className="flex flex-col items-center gap-3" onClick={e=>e.stopPropagation()}>
          <div className="flex items-center gap-3 rounded-xl border border-emerald2/30 bg-emerald2/5 px-4 py-3">
            <Icon name="CheckCircle2" size={20} style={{color:"#10B981"}} />
            <div className="text-start">
              <div className="font-semibold text-sm truncate max-w-[240px]">{value.filename}</div>
              <div className="text-xs text-slate-400 mono">{(value.size_bytes/1024).toFixed(1)} KB</div>
            </div>
            <button onClick={onClear} className="p-1 rounded hover:bg-slate-800 text-slate-400"><Icon name="X" size={16} /></button>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Build Detail ----------
function BuildDetail({ user, buildId }) {
  const [tick, setTick] = useState(0);
  useEffect(() => { const t = setInterval(()=>setTick(x=>x+1), 800); return ()=>clearInterval(t); }, []);
  const builds = store.get("apkforge_builds_"+user.user_id, []);
  const build = builds.find(b => b.build_id === buildId);
  const projects = store.get("apkforge_projects_"+user.user_id, []);
  const project = builds && projects.find(p => p.project_id === build?.project_id);

  if (!build) return <div className="max-w-7xl mx-auto px-4 py-10 text-slate-400">لم يتم العثور على البناء.</div>;
  const meta = STATUS[build.status] || STATUS.queued;
  const active = build.status !== "completed" && build.status !== "error";
  const terminalRef = useRef(null);
  useEffect(() => { if(terminalRef.current) terminalRef.current.scrollTop = terminalRef.current.scrollHeight; }, [tick, build.logs.length]);

  return (
    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <div className="flex items-start justify-between gap-4 mb-6 flex-wrap">
        <div>
          <a href="#/dashboard" className="text-slate-500 text-sm inline-flex items-center gap-1 hover:text-white mb-2"><Icon name="ArrowRight" size={14}/> لوحة التحكم</a>
          <h1 className="heading text-2xl sm:text-3xl font-extrabold break-words">
            {project?.app_name || "تطبيق"}
            <span className="mono text-xs sm:text-sm text-slate-500 ms-2 sm:ms-3 block sm:inline">{project?.package_id}</span>
          </h1>
          <div className="mono text-xs text-slate-500 mt-1" dir="ltr">build_id: {build.build_id}</div>
        </div>
        <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full" style={{background:`${meta.c}12`, border:`1px solid ${meta.c}40`, color:meta.c}}>
          <Icon name={meta.icon} size={16} /> <span className="mono text-sm">{meta.label}</span>
        </div>
      </div>

      <div className="mb-8">
        <div className="flex items-center justify-between mb-2">
          <span className="mono text-xs text-slate-500">التقدم</span>
          <span className="mono text-xs">{build.progress}%</span>
        </div>
        <div className="h-2 rounded-full bg-slate-900 overflow-hidden">
          <div className="h-full transition-all duration-500" style={{ width: `${build.progress}%`, background: build.status==="error" ? "#F43F5E" : "linear-gradient(90deg,#00E5FF,#10B981)" }} />
        </div>
      </div>

      <div className="grid lg:grid-cols-[1fr_.7fr] gap-6 lg:gap-8">
        <div>
          <div className="terminal">
            <div className="flex items-center gap-2 px-4 py-2 border-b border-slate-800/80">
              <span className="w-2.5 h-2.5 rounded-full bg-rose2" />
              <span className="w-2.5 h-2.5 rounded-full bg-amber2" />
              <span className="w-2.5 h-2.5 rounded-full bg-emerald2" />
              <span className="mono text-xs text-slate-400 ms-2">build-terminal — apkforge@studio</span>
              <span className="ms-auto text-[10px] mono text-slate-500 uppercase">{build.status}</span>
            </div>
            <div ref={terminalRef} className="p-2 h-[300px] sm:h-[360px] overflow-auto" dir="ltr">
              {build.logs.map((l,i)=>(
                <div key={i} className="py-0.5 px-3 log-info">
                  <span className="text-slate-600 me-2">[{new Date(l.ts).toLocaleTimeString()}]</span>{l.message}
                </div>
              ))}
              {active && <div className="py-0.5 px-3 cursor-blink" />}
            </div>
          </div>

          {build.status === "completed" && (
            <div className="mt-6 card-glow p-5 sm:p-6 fade-in">
              <div className="flex items-center gap-3 mb-4 flex-wrap">
                <div className="w-11 h-11 rounded-xl bg-emerald2/15 border border-emerald2/40 flex items-center justify-center">
                  <Icon name="CheckCircle2" style={{color:"#10B981"}} size={22} />
                </div>
                <div>
                  <div className="heading font-bold">تم بناء الـ APK بنجاح</div>
                  <div className="mono text-xs text-slate-500">جاهز للتحميل والتثبيت</div>
                </div>
                <button onClick={()=>downloadApk(build, project)} className="ms-auto btn-primary px-4 py-2.5 rounded-lg inline-flex items-center gap-2">
                  <Icon name="Download" size={16} /> تحميل APK
                </button>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <ApkStat icon="HardDrive" label="الحجم" value={`${build.apk_size_kb} KB`} />
                <ApkStat icon="Shield" label="التوقيع" value={project?.signing_mode || "debug"} />
                <ApkStat icon="Cpu" label="Min SDK" value="21 (Android 5.0)" />
                <ApkStat icon="Hash" label="SHA-256" value={build.apk_sha256?.slice(0,12)+"..."} mono />
              </div>
            </div>
          )}
        </div>

        <div className="lg:sticky lg:top-24 h-fit space-y-4">
          <div className="card-glow p-6 flex flex-col items-center gap-4">
            <PhonePreview appName={project?.app_name || "تطبيقي"} themeColor={project?.theme_color || "#00E5FF"} splashColor={project?.splash_color || "#0B0F17"} orientation={project?.orientation || "portrait"} showApp={build.status==="completed"} />
            <div className="mono text-[11px] text-slate-500 text-center">{build.status==="completed"?"✓ مثبّت على الهاتف المحاكى":"جاري التجهيز..."}</div>
          </div>
        </div>
      </div>
    </div>
  );
}
function ApkStat({ icon, label, value, mono }){
  return (<div className="p-3 rounded-xl border border-slate-800 min-w-0">
    <div className="flex items-center gap-2 text-xs text-slate-500 mb-1"><Icon name={icon} size={12}/> {label}</div>
    <div className={"text-sm truncate " + (mono?"mono":"heading font-semibold")} dir="ltr">{value}</div>
  </div>);
}

// ---------- App root ----------
function App() {
  const auth = useAuth();
  const [signIn, setSignIn] = useState(false);
  const hash = useHash();
  const path = hash.replace(/^#/, "") || "/";
  const parts = path.split("/").filter(Boolean);

  const openStart = () => auth.user ? go("#/dashboard") : setSignIn(true);
  const onSignedIn = (u) => { auth.login(u); setSignIn(false); go("#/dashboard"); };

  useEffect(() => {
    // Redirect from protected routes when not authed
    const protectedRoot = ["dashboard","new-build","builds"];
    if (!auth.user && parts[0] && protectedRoot.includes(parts[0])) go("#/");
  }, [auth.user, parts[0]]);

  return (
    <>
      <Navbar user={auth.user} onLogin={()=>setSignIn(true)} onLogout={auth.logout} />
      {parts.length === 0 || parts[0] === "" ? (
        <Landing user={auth.user} onStart={openStart} />
      ) : parts[0] === "dashboard" && auth.user ? (
        <Dashboard user={auth.user} />
      ) : parts[0] === "new-build" && auth.user ? (
        <NewBuild user={auth.user} />
      ) : parts[0] === "builds" && parts[1] && auth.user ? (
        <BuildDetail user={auth.user} buildId={parts[1]} />
      ) : (
        <Landing user={auth.user} onStart={openStart} />
      )}
      <SignInModal open={signIn} onClose={()=>setSignIn(false)} onSignedIn={onSignedIn} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
